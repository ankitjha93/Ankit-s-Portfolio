<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <path id="textPathTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
    <path id="textPathBottom" d="M 165,105 A 70,70 0 0,1 35,105" fill="none" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="#0d081f" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="66" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Top Text: BHARAT MATA EM HSS -->
  <text font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="url(#goldGrad)" letter-spacing="1.5">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      BHARAT MATA EM H.S. SCHOOL
    </textPath>
  </text>

  <!-- Bottom Text: BILASPUR -->
  <text font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ★ BILASPUR ★
    </textPath>
  </text>

  <!-- Inner Crest: Shield -->
  <path d="M 80,68 L 120,68 C 120,68 123,95 100,118 C 77,95 80,68 80,68 Z" fill="#181335" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Open Book of Knowledge -->
  <path d="M 86,94 C 92,90 98,90 100,92 C 102,90 108,90 114,94 L 114,84 C 108,80 102,80 100,82 C 98,80 92,80 86,84 Z" fill="url(#goldGrad)"/>
  <line x1="100" y1="82" x2="100" y2="94" stroke="#0d081f" stroke-width="1.5"/>

  <!-- Flaming Torch of Wisdom above Book -->
  <path d="M 97,76 L 103,76 L 101.5,82 L 98.5,82 Z" fill="url(#goldGrad)"/>
  <path d="M 100,68 C 96,72 104,73 100,76 C 103,75 104,72 100,68 Z" fill="#ef4444"/>
  <circle cx="100" cy="72" r="1.5" fill="#fde047"/>

  <!-- Three Golden Stars below Shield -->
  <polygon points="100,123 102,128 107,128 103,131 105,136 100,133 95,136 97,131 93,128 98,128" fill="url(#goldGrad)"/>
  <polygon points="85,121 86.5,125 90,125 87,127.5 88.5,131 85,129 81.5,131 83,127.5 80,125 83.5,125" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="115,121 116.5,125 120,125 117,127.5 118.5,131 115,129 111.5,131 113,127.5 110,125 113.5,125" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
